*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.2rem)}h2{font-size:clamp(1.5rem,4vw,2rem)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font-weight:700;font-family:Georgia,serif}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:.85rem}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.hero{padding:56px 0 40px}
.hero p{font-size:1.15rem;color:var(--muted);max-width:620px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-t);padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line);margin-left:8px}
section{padding:36px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.card .ic{font-size:1.8rem}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 56px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:700}
form,.calc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
label{font-size:.9rem;color:var(--muted);display:grid;gap:4px}
input,select,textarea{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.note{font-size:.85rem;color:var(--muted)}
[hidden]{display:none!important}
.badge{display:inline-block;background:var(--line);padding:3px 10px;border-radius:99px;font-size:.8rem}
.out{font-size:1.4rem;font-weight:700}
.msg{padding:10px 14px;border-radius:10px;background:var(--line)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--line);padding:28px 0 90px;color:var(--muted);font-size:.9rem}
.sticky{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:12}
.sticky a{flex:1;text-align:center;margin:0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

 const P0=CONFIG.prices,e0=n=>"€ "+n.toLocaleString(lang);$("#prices").innerHTML=[[t.sv.umzug[1],t.pCar,e0(P0.carHour)+" / "+t.h],[t.sv.umzug[1]+", "+t.sv.montage[1],t.pStaff,e0(P0.workerHour)+" / "+t.h],[t.sv.malerei[1],"",e0(P0.paintM2)+" / m² "+t.layer+", "+t.mat],[t.sv.reinigung[1],"",t.onReq]].map(r=>`<div class="card"><h3>${r[0]}</h3><p class="note">${r[1]}</p><div class="out">${r[2]}</div></div>`).join("");
 $("[data-i=priceN]").textContent=t.pMin.replace("{h}",P0.minMoveHours.toLocaleString(lang))+" "+t.priceN;
 $("#steps").innerHTML=t.st.map(s=>`<li>${s}</li>`).join("");
 $("#faq").innerHTML=t.fq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("");
 const c2=$("#cs").value;$("#cs").innerHTML=CONFIG.services.map(k=>`<option value="${k}">${t.sv[k][1]}</option>`).join("");if(c2)$("#cs").value=c2;const cur=$("#fs").value;$("#fs").innerHTML=CONFIG.services.map(k=>`<option value="${k}">${t.sv[k][1]}</option>`).join("");if(cur)$("#fs").value=cur;
 calc();
}
function calc(){const t=T[lang],P=CONFIG.prices,s=$("#cs").value;const w=+$("#workers").value,h=Math.max(1,+$("#hours").value||1),m=Math.max(1,+$("#area").value||1);$("#lw").hidden=$("#lh").hidden=!(s==="umzug"||s==="montage");$("#la").hidden=$("#ly").hidden=s!=="malerei";const f=n=>"€ "+n.toLocaleString(lang);let o;if(s==="umzug")o=f(Math.max(h,P.minMoveHours)*(P.carHour+w*P.workerHour));else if(s==="montage")o=f(h*w*P.workerHour);else if(s==="malerei")o=f(m*(+$("#layers").value||1)*P.paintM2)+" "+t.mat;else o=t.onReq;
 $("#est").textContent=s==="reinigung"?o:`${t.est}: ≈ ${o}`}
$("#langs").addEventListener("click",e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.setItem("lang",l)}catch(x){}history.replaceState(null,"","#"+l);render()});
$("#workers").onchange=calc;$("#cs").onchange=calc;$("#hours").oninput=calc;$("#area").oninput=calc;$("#layers").onchange=calc;
$("#f").addEventListener("submit",e=>{e.preventDefault();const t=T[lang],r=$("#res");
 const ok=$("#fn").value.trim()&&$("#fp").value.trim().length>=6&&/^\S+@\S+\.\S+$/.test($("#fe").value)&&$("#fc").checked&&!$("#hp").value;
 r.hidden=false;
 if(!ok){r.textContent=t.err;return}
 const tx=["Новая заявка: "+$("#fs").selectedOptions[0].text,"Имя: "+$("#fn").value,"Тел: "+$("#fp").value,"Email: "+$("#fe").value,"Район: "+$("#fd").value,"Дата: "+$("#fdt").value,"Описание: "+$("#fm").value].join("\n");
 const a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener";a.href="https://t.me/"+CONFIG.tg+"?text="+encodeURIComponent(tx);a.textContent=t.ok;r.textContent="";r.appendChild(a)});
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="tel:"]');if(!a)return;
 const u="tel:"+CONFIG.phoneRaw,tt=$("#toast");
 try{navigator.clipboard.writeText(CONFIG.phoneRaw)}catch(x){}
 tt.hidden=false;tt.textContent="📞 "+CONFIG.phone;setTimeout(()=>{tt.hidden=true},8000);
 e.preventDefault();
 try{if(!window.open(u,"_top"))location.href=u}catch(x){location.href=u}
});
render();
</script>
</body>
